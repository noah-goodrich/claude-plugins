name: test

on:
  push:
    paths:
      - "research-tools/**"
      - "noah-content-tools/**"
      - "noah-writing-voice/**"
      - "borg-collective/hooks/**"
      - "token-cost/hooks/**"
      - "evals/**"
      - "**/test/**"
      - "build-plugins.sh"
      - ".claude-plugin/**"
      - "**/.claude-plugin/**"
      - ".github/workflows/test.yml"
  pull_request:
    paths:
      - "research-tools/**"
      - "noah-content-tools/**"
      - "noah-writing-voice/**"
      - "borg-collective/hooks/**"
      - "token-cost/hooks/**"
      - "evals/**"
      - "**/test/**"
      - "build-plugins.sh"
      - ".claude-plugin/**"
      - "**/.claude-plugin/**"
      - ".github/workflows/test.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # Job 1: existing research-tools test suite (bash, no bats required)
  # ---------------------------------------------------------------------------
  research-tools:
    name: research-tools hook suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install jq
        run: sudo apt-get install -y --no-install-recommends jq

      - name: Run research-tools regression suite
        run: bash research-tools/hooks/test/run-tests.sh

  # ---------------------------------------------------------------------------
  # Job 2: borg-collective + token-cost hook BATS suites + shellcheck
  # ---------------------------------------------------------------------------
  hook-bats:
    name: hook BATS suites + shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies (jq, shellcheck, bats)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends jq shellcheck bats

      - name: Verify bats version
        run: bats --version

      - name: shellcheck — borg-link-down.sh
        run: shellcheck --severity=warning borg-collective/hooks/borg-link-down.sh

      - name: shellcheck — borg-link-up.sh
        run: shellcheck --severity=warning borg-collective/hooks/borg-link-up.sh

      - name: shellcheck — token-spend-log.sh
        run: shellcheck --severity=warning token-cost/hooks/token-spend-log.sh

      - name: BATS — borg-link-down
        run: bats borg-collective/hooks/test/borg-link-down.bats

      - name: BATS — borg-link-up
        run: bats borg-collective/hooks/test/borg-link-up.bats

      - name: BATS — token-spend-log
        run: bats token-cost/hooks/test/token-spend-log.bats

  # ---------------------------------------------------------------------------
  # Job 3: design-doc template validator
  # validate.sh and its suite use only bash, awk, grep, head, tr, mktemp and cp,
  # all present on ubuntu-latest — so this job installs nothing.
  # ---------------------------------------------------------------------------
  design-doc:
    name: design-doc validator suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run design-doc validator suite
        run: bash noah-content-tools/skills/design-doc/test/run-tests.sh

  # ---------------------------------------------------------------------------
  # Job 4: marketplace <-> plugin manifest guard
  # A plugin listed in marketplace.json with no .claude-plugin/plugin.json is
  # advertised but uninstallable; build-plugins.sh used to skip it silently.
  # The guard runs as part of the build, so this job packages everything too.
  # ---------------------------------------------------------------------------
  marketplace:
    name: marketplace manifest guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies (jq, shellcheck, zip)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends jq shellcheck zip

      - name: shellcheck — build-plugins.sh
        run: shellcheck --severity=warning build-plugins.sh

      - name: Marketplace guard + package all plugins
        run: bash build-plugins.sh

  # ---------------------------------------------------------------------------
  # Job 5: ai-scoring evaluation harness suite
  # evals/harness/ is standard-library Python 3 and makes no network calls, so
  # this job installs nothing beyond the runner's preinstalled python3.
  # evals/generate/ is NOT run here and must never be added: it calls provider
  # APIs, which costs real money and requires secrets CI does not hold.
  # ---------------------------------------------------------------------------
  evals-harness:
    name: evals harness suite (harness only, never the generator)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run evals harness suite — harness tests only, no generation
        run: bash evals/test/run-tests.sh
